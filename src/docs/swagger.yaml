openapi: 3.0.0
info:
  title: Profile Management API
  version: 1.0.0
  description: |
    API for managing profiles with authentication via GitHub OAuth.
    Supports profile CRUD operations, CSV uploads, and natural language search.
  contact:
    name: API Support
    email: support@example.com

servers:
  - url: http://localhost:3000
    description: Local development server
  - url: https://hng14-stage3-insighta-labs-backend.pxxl.click
    description: Production server

security:
  - bearerAuth: []
  - cookieAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token from OAuth flow
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: HTTP-only cookie containing JWT access token
    csrfAuth:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: CSRF token for state-changing operations

  schemas:
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: An error occurred
        errors:
          type: array
          items:
            type: string
          required: false

    SuccessResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Operation successful

    Profile:
      type: object
      required:
        - id
        - name
        - gender
        - age
        - age_group
        - country_id
        - country_name
      properties:
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        name:
          type: string
          example: John Doe
        gender:
          type: string
          enum: [male, female]
          example: male
        gender_probability:
          type: number
          format: float
          minimum: 0
          maximum: 1
          example: 0.95
        age:
          type: integer
          minimum: 0
          example: 25
        age_group:
          type: string
          enum: [child, teenager, adult, senior]
          example: adult
        country_id:
          type: string
          example: NG
        country_name:
          type: string
          example: Nigeria
        country_probability:
          type: number
          format: float
          minimum: 0
          maximum: 1
          example: 0.87
        created_at:
          type: string
          format: date-time
          example: 2026-05-06T12:00:00.000Z

    ProfileListResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Profiles retrieved successfully
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 2026
        total_pages:
          type: integer
          example: 203
        links:
          type: object
          properties:
            self:
              type: string
              example: /api/profiles?page=1&limit=10
            next:
              type: string
              example: /api/profiles?page=2&limit=10
            prev:
              type: string
              example: /api/profiles?page=1&limit=10
        data:
          type: array
          items:
            $ref: '#/components/schemas/Profile'

    CreateProfileRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: John Doe
          minLength: 1

    AuthInitiateResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: CLI auth initiated
        data:
          type: object
          properties:
            auth_url:
              type: string
              example: https://github.com/login/oauth/authorize?...
            temp_token:
              type: string
              example: a1b2c3d4e5f6...

    TokenResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: Authentication successful
        data:
          type: object
          properties:
            access_token:
              type: string
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            refresh_token:
              type: string
              example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
            user:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                username:
                  type: string
                  example: johndoe
                email:
                  type: string
                  example: john@example.com
                avatar_url:
                  type: string
                  example: https://avatars.githubusercontent.com/u/12345
                role:
                  type: string
                  enum: [ANALYST, ADMIN]

    RefreshTokenRequest:
      type: object
      properties:
        refresh_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    CSVUploadResponse:
      type: object
      properties:
        status:
          type: string
          example: success
        message:
          type: string
          example: CSV upload processed
        data:
          type: object
          properties:
            total_rows:
              type: integer
              example: 50000
            inserted:
              type: integer
              example: 48231
            skipped:
              type: integer
              example: 1769
            reasons:
              type: object
              properties:
                duplicate_name:
                  type: integer
                  example: 1203
                invalid_age:
                  type: integer
                  example: 312
                missing_fields:
                  type: integer
                  example: 254

  parameters:
    ApiVersionHeader:
      name: X-API-Version
      in: header
      required: true
      description: API version header (must be "1")
      schema:
        type: string
        example: '1'

    PageParam:
      name: page
      in: query
      description: Page number
      schema:
        type: integer
        default: 1
        minimum: 1

    LimitParam:
      name: limit
      in: query
      description: Number of results per page
      schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 50

    GenderParam:
      name: gender
      in: query
      description: Filter by gender
      schema:
        type: string
        enum: [male, female]

    CountryParam:
      name: country_id
      in: query
      description: Filter by country code
      schema:
        type: string
        example: NG

    AgeGroupParam:
      name: age_group
      in: query
      description: Filter by age group
      schema:
        type: string
        enum: [child, teenager, adult, senior]

    MinAgeParam:
      name: min_age
      in: query
      description: Minimum age filter
      schema:
        type: integer
        minimum: 0

    MaxAgeParam:
      name: max_age
      in: query
      description: Maximum age filter
      schema:
        type: integer
        minimum: 0

    MinGenderProbabilityParam:
      name: min_gender_probability
      in: query
      description: Minimum gender probability (0-1)
      schema:
        type: number
        minimum: 0
        maximum: 1

    MinCountryProbabilityParam:
      name: min_country_probability
      in: query
      description: Minimum country probability (0-1)
      schema:
        type: number
        minimum: 0
        maximum: 1

    SortByParam:
      name: sort_by
      in: query
      description: Field to sort by
      schema:
        type: string
        enum: [age, created_at, gender_probability]

    SortOrderParam:
      name: order
      in: query
      description: Sort order
      schema:
        type: string
        enum: [asc, desc]

    SearchQueryParam:
      name: q
      in: query
      required: true
      description: Natural language search query
      schema:
        type: string
        example: young males from nigeria

paths:
  /auth/github:
    get:
      summary: Initiate GitHub OAuth
      description: |
        Initiates GitHub OAuth flow with PKCE.
        For web clients, redirects the browser to GitHub OAuth.
        For CLI clients, returns auth URL and temp token for polling.
      tags: [Authentication]
      security: []
      parameters:
        - name: client
          in: query
          required: true
          description: Client type
          schema:
            type: string
            enum: [web, cli]
        - name: redirect_uri
          in: query
          required: false
          description: Backend OAuth callback URL. Defaults to GITHUB_REDIRECT_URI and should end with /auth/github/callback.
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to GitHub OAuth (web client)
          headers:
            Location:
              schema:
                type: string
        '200':
          description: CLI auth initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthInitiateResponse'
        '400':
          description: Missing or invalid client parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/github/callback:
    get:
      summary: OAuth Callback / CLI Token Poll
      description: |
        Handles GitHub OAuth callback for web clients and CLI browser callbacks.
        Web callbacks set HTTP-only auth cookies and return user details as JSON.
        CLI browser callbacks return a small HTML success page.
        For CLI polling, use temp_token query parameter.
      tags: [Authentication]
      security: []
      parameters:
        - name: code
          in: query
          description: Authorization code from GitHub
          schema:
            type: string
        - name: state
          in: query
          description: Encoded state containing client type and temp_token
          schema:
            type: string
        - name: temp_token
          in: query
          description: Temporary token for CLI polling
          schema:
            type: string
      responses:
        '200':
          description: |
            - **Web callback**: Sets HTTP-only auth cookies and returns user details as JSON
            - **CLI polling**: Returns tokens as JSON
            - **CLI browser callback**: Returns HTML success page
          headers:
            Set-Cookie:
              schema:
                type: string
                description: HTTP-only auth cookies (set on web callback only)
                example: access_token=...; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: Web callback — user details
                    properties:
                      status:
                        type: string
                        example: success
                      message:
                        type: string
                        example: Authentication successful
                      data:
                        type: object
                        properties:
                          user:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                              username:
                                type: string
                              email:
                                type: string
                              avatar_url:
                                type: string
                              role:
                                type: string
                                enum: [ANALYST, ADMIN]
                  - $ref: '#/components/schemas/TokenResponse'
            text/html:
              schema:
                type: string
                example: <html><body><h2>Login successful</h2></body></html>
        '202':
          description: CLI authentication is still pending
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: pending
        '400':
          description: Missing code or state parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: Session expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      summary: Refresh Access Token
      description: |
        Implements refresh token rotation.
        Consumes old refresh token and issues new access + refresh token pair.
        The refresh token can be sent in the HTTP-only refresh_token cookie or in the JSON request body.
      tags: [Authentication]
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed successfully
          headers:
            Set-Cookie:
              schema:
                type: string
                example: access_token=...; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Token refreshed
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          username:
                            type: string
                          email:
                            type: string
                          avatar_url:
                            type: string
                          role:
                            type: string
                            enum: [ANALYST, ADMIN]
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Account inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      summary: Logout
      description: Invalidates refresh token in database and clears auth cookies
      tags: [Authentication]
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Logged out successfully
          headers:
            Set-Cookie:
              schema:
                type: string
                example: access_token=; Max-Age=0; HttpOnly
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/profiles:
    get:
      summary: List Profiles
      description: |
        Retrieve profiles with filtering, pagination, and sorting.
        Results are cached in Redis for 5 minutes.
      tags: [Profiles]
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/GenderParam'
        - $ref: '#/components/parameters/CountryParam'
        - $ref: '#/components/parameters/AgeGroupParam'
        - $ref: '#/components/parameters/MinAgeParam'
        - $ref: '#/components/parameters/MaxAgeParam'
        - $ref: '#/components/parameters/MinGenderProbabilityParam'
        - $ref: '#/components/parameters/MinCountryProbabilityParam'
        - $ref: '#/components/parameters/SortByParam'
        - $ref: '#/components/parameters/SortOrderParam'
      responses:
        '200':
          description: Profiles retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - insufficient role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Create Profile
      description: |
        Creates a new profile by calling external APIs (Genderize, Agify, Nationalize)
        to predict gender, age, and nationality based on the name.
        Requires ADMIN role.
      tags: [Profiles]
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ApiVersionHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProfileRequest'
      responses:
        '201':
          description: Profile created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/Profile'
        '200':
          description: Profile already exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Profile already exists
                  data:
                    $ref: '#/components/schemas/Profile'
        '400':
          description: Missing or invalid name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - ADMIN role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/profiles/search:
    get:
      summary: Search Profiles (Natural Language)
      description: |
        Search profiles using natural language queries.
        Supports queries like "young males from nigeria" or "women above 30 from US".
      tags: [Profiles]
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ApiVersionHeader'
        - $ref: '#/components/parameters/SearchQueryParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileListResponse'
        '400':
          description: Missing or empty query parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - insufficient role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unable to interpret query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/profiles/export:
    get:
      summary: Export Profiles to CSV
      description: Export filtered profiles to CSV file
      tags: [Profiles]
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ApiVersionHeader'
        - name: format
          in: query
          required: true
          description: Export format
          schema:
            type: string
            enum: [csv]
        - $ref: '#/components/parameters/GenderParam'
        - $ref: '#/components/parameters/CountryParam'
        - $ref: '#/components/parameters/AgeGroupParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: CSV file download
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - insufficient role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/profiles/{id}:
    get:
      summary: Get Single Profile
      description: Retrieve a single profile by ID
      tags: [Profiles]
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ApiVersionHeader'
        - name: id
          in: path
          required: true
          description: Profile UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/Profile'
        '400':
          description: Missing profile ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - insufficient role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Delete Profile
      description: Delete a profile by ID. Requires ADMIN role.
      tags: [Profiles]
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ApiVersionHeader'
        - name: id
          in: path
          required: true
          description: Profile UUID
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Profile deleted successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - ADMIN role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/profiles/upload/{jobId}:
    get:
      summary: Get CSV Upload Job Status
      description: |
        Poll the status of a CSV upload job.
        Returns current state, progress, and result (when completed) or error (when failed).
      tags: [Profiles]
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ApiVersionHeader'
        - name: jobId
          in: path
          required: true
          description: BullMQ job ID returned by the upload endpoint
          schema:
            type: string
      responses:
        '200':
          description: Job status retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      job_id:
                        type: string
                        example: bullmq-job-id
                      state:
                        type: string
                        enum: [completed, failed, active, waiting, delayed]
                        example: completed
                      progress:
                        type: number
                        example: 1
                      file:
                        type: string
                        example: profiles.csv
                      result:
                        type: object
                        properties:
                          total_rows:
                            type: integer
                          inserted:
                            type: integer
                          skipped:
                            type: integer
                          reasons:
                            type: object
                            properties:
                              duplicate_name:
                                type: integer
                              invalid_age:
                                type: integer
                              missing_fields:
                                type: integer
                              invalid_gender:
                                type: integer
                      error:
                        type: string
                        description: Error message if the job failed
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Queue service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/profiles/upload:
    post:
      summary: Upload CSV File
      description: |
        Upload CSV file for async processing via BullMQ queue.
        Returns a job ID for polling status via GET /api/profiles/upload/{jobId}.
        Requires ADMIN role.
      tags: [Profiles]
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/ApiVersionHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV file (max 100MB, .csv mimetype)
      responses:
        '202':
          description: CSV upload queued for processing
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Upload queued for processing
                  data:
                    type: object
                    properties:
                      job_id:
                        type: string
                        example: bullmq-job-id
        '400':
          description: No file uploaded or invalid file type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - ADMIN role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
